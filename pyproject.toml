[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "urlsyntax"
version = "0.2.1"
description = "Syntax-only http and https URL validation, parsing, normalization and resolution per RFC 3986 and RFC 9110, in agreement with browsers on hosts, zero dependencies, fully typed, no network or DNS"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["url", "uri", "validation", "normalization", "rfc3986", "rfc9110", "whatwg", "parser", "ipv6", "ssrf", "canonicalization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/urlsyntax"
Issues = "https://github.com/JaviLianes8/urlsyntax/issues"
Changelog = "https://github.com/JaviLianes8/urlsyntax/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[project.scripts]
urlsyntax = "urlsyntax._cli:main"

[tool.hatch.build.targets.sdist]
# Third-party test files are fetched locally and never shipped; only their manifest is.
include = [
    "src/urlsyntax",
    "tests/*.py",
    "tests/data/rfc_examples.json",
    "tests/upstream/MANIFEST.json",
    "scripts/fetch_upstream.py",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/urlsyntax"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
